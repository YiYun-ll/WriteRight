name: EssayPilot
options:
  bundleIdPrefix: com.yiyun
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  EssayPilot:
    type: application
    platform: iOS
    sources:
      - path: EssayPilot
    configFiles:
      Debug: Config/Development.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yiyun.essaypilot.dev
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WriteRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  EssayPilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EssayPilotTests
    dependencies:
      - target: EssayPilot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  EssayPilotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EssayPilotUITests
    dependencies:
      - target: EssayPilot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  EssayPilot:
    build:
      targets:
        EssayPilot: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EssayPilotTests
        - EssayPilotUITests
