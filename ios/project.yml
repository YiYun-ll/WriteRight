name: EssayPilot
options:
  bundleIdPrefix: com.yiyun
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  EssayPilot:
    type: application
    platform: iOS
    sources:
      - path: EssayPilot
      - path: Shared
    configFiles:
      Debug: Config/Development.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
      - target: WriteRightWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yiyun.essaypilot.dev
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Config/Simulator.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Config/Shared.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/AppInfo.plist
        INFOPLIST_KEY_CFBundleDisplayName: WriteRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: 拍摄题目和作文，交给 AI 看图批改并保留原稿回看。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
  WriteRightWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WriteRightWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yiyun.essaypilot.dev.widgets
        PRODUCT_NAME: WriteRightWidgets
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Config/Widget.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/WidgetInfo.plist
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  EssayPilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EssayPilotTests
    dependencies:
      - target: EssayPilot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  EssayPilotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EssayPilotUITests
    dependencies:
      - target: EssayPilot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  EssayPilot:
    build:
      targets:
        EssayPilot: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EssayPilotTests
        - EssayPilotUITests
