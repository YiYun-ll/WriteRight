<!doctype html>
<html lang="zh-CN">
  <body style="margin:0;background:#f8f5ef;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#26231f">
    <main style="max-width:480px;margin:40px auto;padding:32px;background:#ffffff;border-radius:20px">
      <h1 style="font-size:24px;margin:0 0 28px">WriteRight</h1>
      <p style="font-size:16px;line-height:1.6">你的登录验证码</p>
      <p style="font-size:36px;font-weight:700;letter-spacing:8px;margin:20px 0">{{ .Token }}</p>
      <p style="font-size:14px;line-height:1.6;color:#756f67">验证码将在 60 分钟后失效。如果这不是你的操作，请忽略此邮件。</p>
    </main>
  </body>
</html>
